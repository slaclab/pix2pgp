# Read the Docs configuration file for pix2pgp
# See https://docs.readthedocs.io/en/stable/config-file/v2.html

version: 2

build:
  os: ubuntu-22.04
  tools:
    python: "3.11"
  apt_packages:
    - doxygen
  jobs:
    pre_build:
      # Run doxygen so breathe can find doxyxml/ before sphinx-build starts
      - cd docs && doxygen Doxyfile

sphinx:
  configuration: docs/src/conf.py
  fail_on_warning: false

python:
  install:
    - requirements: docs/requirements.txt

# Build the HTML formats
formats:
  - htmlzip
  - pdf

name: Build and Publish Documentation

on:
  push:
    branches:
      - doc-dev
  # Allow manual re-runs from the Actions tab
  workflow_dispatch:

# Only one deploy at a time; cancel any in-flight run on new pushes
concurrency:
  group: pages-doc-dev
  cancel-in-progress: true

permissions:
  contents: write   # needed to push to the gh-pages branch

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Check out doc-dev
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.2.2
        with:
          submodules: recursive
          fetch-depth: 0   # gives `git describe` in conf.py a real history

      - name: Install Doxygen
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends doxygen

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.4.0
        with:
          python-version: "3.11"

      - name: Install Sphinx and friends
        run: |
          python -m pip install --upgrade pip
          pip install -r docs/requirements.txt

      - name: Run Doxygen
        working-directory: docs
        run: doxygen Doxyfile

      - name: Build HTML with Sphinx
        working-directory: docs
        run: sphinx-build -b html src build/html

      # Prevent Jekyll from filtering underscore-prefixed files
      # (Sphinx writes _static/, _sources/, etc.)
      - name: Disable Jekyll
        run: touch docs/build/html/.nojekyll

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453  # v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: docs/build/html
          publish_branch: gh-pages
          # Track the branch that produced this build in the commit message
          commit_message: "docs: publish from doc-dev @ ${{ github.sha }}"
          user_name: "github-actions[bot]"
          user_email: "github-actions[bot]@users.noreply.github.com"
